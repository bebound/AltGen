# altgen merge config example.
# Run: altgen merge -c examples/merge.toml apps/a.json apps/b.json -o out.json
#
# Merge mode only reads [source] (root source metadata) and [output];
# the apps and news entries are extracted from the input apps.json files.
# Build-mode tables ([github], [app], [versions], [news]) are rejected.
# Root values also work as CLI flags, e.g. altgen merge --name ... a.json.

[source]
name = "AltGen"
subtitle = "Auto-updated AltStore sources built with altgen"
description = "AltStore sources generated from GitHub Releases by altgen"
icon_url = "https://raw.githubusercontent.com/bebound/altgen/master/assets/icon.png"
website = "https://github.com/bebound/altgen"
tint_color = "#4192cd"

[output]
path = "all-apps.json"   # resolved against THIS file's directory
