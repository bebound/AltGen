[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altgen"
version = "0.1.0"
description = "Generate AltStore apps.json sources from GitHub Releases IPA assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
altgen = "altgen.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
